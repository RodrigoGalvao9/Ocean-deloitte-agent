name: Publish README Markmap

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/publish-markmap.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare README for Markmap
        run: |
          mkdir -p _site
          grep -vF '[![Mapa mental do README]' README.md > _site/README.md
      - name: Generate interactive Markmap
        run: npx --yes @markmap/cli@1.1.1 _site/README.md --no-open --output _site/index.html
      - name: Generate README preview image
        run: npx --yes @markmap/cli@1.1.1 _site/README.md --svg --no-open --output _site/markmap.svg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
